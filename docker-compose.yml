services:
  telegram-agy-bridge:
    build: .
    container_name: telegram-agy-bridge
    restart: always
    env_file:
      - .env
    environment:
      - AGY_PATH=/root/.local/bin/agy
      - WORKSPACE_DIR=/project
      - HOME=/root
    volumes:
      - /home/rezaserver/project:/project
      - /home/rezaserver/.gemini:/root/.gemini
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hermes-net

networks:
  hermes-net:
    external: true
